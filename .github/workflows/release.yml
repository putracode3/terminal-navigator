name: Release

# Trigger: push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Flow: pre-flight gate (same 3 commands as docs/ops/runbook.md §2) must pass
# before any platform build starts; then Linux/macOS/Windows installers are
# built and attached to a draft GitHub Release for manual publish.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  pre-flight:
    name: Pre-flight gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Frontend tests
        run: npx vitest run

      - name: Type check
        run: npm run check

  build-and-release:
    name: Build (${{ matrix.platform }})
    needs: pre-flight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Terminal Navigator ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG or commit history for details."
          releaseDraft: true
          prerelease: false
