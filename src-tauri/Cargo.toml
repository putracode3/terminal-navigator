[package]
name = "terminal-navigator"
version = "0.2.2"
description = "Project launcher + terminal for local projects"
authors = ["Denny Setia Wisnugraha"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terminal_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
bincode = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"

# Strip debug symbols from the release binary: 18.2 MB -> 11.7 MB, no extra
# build time, same runtime memory (measured 2026-09-29; RAM is dominated by
# the WebKit process, not the binary). `lto` + `codegen-units = 1` would reach
# 9.0 MB but turn a ~1 min release build into ~7 min (2.5 min incremental),
# and bring no RAM gain either, so they are deliberately left off. `panic`
# stays `unwind`: a panic ends only its own thread (one pane's PTY reader, one
# IPC command) and `OutputGate` is written to survive that; `abort` would
# close the whole window and every open terminal with it.
[profile.release]
strip = true
